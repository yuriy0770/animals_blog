{% extends 'main/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card" style="background: rgba(60, 60, 60, 0.95);">
                <div class="card-body p-4">
                    <h2 class="text-center text-white mb-4">👤 Ваш профиль</h2>

                    <div class="text-white mb-4">
                        <p><strong>Email:</strong> {{ user.email }}</p>
                        <p><strong>Имя пользователя:</strong> {{ user.username }}</p>
                        <p><strong>Дата регистрации:</strong> {{ user.date_joined|date:"d.m.Y" }}</p>
                    </div>

                    <div class="d-flex gap-2">
                        <a href="{% url 'main:index' %}" class="btn btn-outline-light">На главную</a>
                        <a href="{% url 'users:logout' %}" class="btn btn-danger">Выйти</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
